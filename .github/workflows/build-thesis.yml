name: Build thesis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Compile thesis and latexdiff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute latexdiff base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master
          base_sha="$(git merge-base origin/master HEAD)"
          head_sha="$(git rev-parse HEAD)"
          echo "BASE_SHA=${base_sha}" >> "${GITHUB_ENV}"
          echo "HEAD_SHA=${head_sha}" >> "${GITHUB_ENV}"
          printf '%s\n' "${base_sha}" > .latexdiff-base-sha
          printf '%s\n' "${head_sha}" > .latexdiff-head-sha
          echo "Latexdiff base: ${base_sha}"
          echo "PR/head commit: ${head_sha}"

      - name: Compile PDFs
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            chmod +x compile.sh scripts/generate_latexdiff.py
            mkdir -p ci_artifacts

            rm -rf output thesis.pdf
            ./compile.sh
            cp thesis.pdf ci_artifacts/thesis.pdf
            cp output/output.log ci_artifacts/thesis.log

            BASE_SHA="$(cat .latexdiff-base-sha)"
            HEAD_SHA="$(cat .latexdiff-head-sha)"
            python3 scripts/generate_latexdiff.py \
              --base-ref "${BASE_SHA}" \
              --head-ref "${HEAD_SHA}" \
              --output thesis-latexdiff.tex
            rm -rf output thesis-latexdiff.pdf
            ./compile.sh thesis-latexdiff.tex
            cp thesis-latexdiff.pdf ci_artifacts/thesis-latexdiff.pdf
            cp output/output.log ci_artifacts/thesis-latexdiff.log
            cp thesis-latexdiff.tex ci_artifacts/thesis-latexdiff.tex

      - name: Upload PDFs and logs
        id: upload-thesis-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci_artifacts/thesis.pdf
            ci_artifacts/thesis.log
            ci_artifacts/thesis-latexdiff.pdf
            ci_artifacts/thesis-latexdiff.log
            ci_artifacts/thesis-latexdiff.tex
          if-no-files-found: warn
          retention-days: 14

      - name: Comment artifact link on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload-thesis-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- thesis-build-artifact-link -->';
            const artifactUrl = process.env.ARTIFACT_URL;
            const runUrl = process.env.RUN_URL;
            const body = [
              marker,
              'Thesis build artifact for this PR update:',
              '',
              artifactUrl
                ? `- [Download thesis PDFs and logs](${artifactUrl})`
                : '- Artifact link was not produced; check the workflow run.',
              `- [Workflow run](${runUrl})`,
              `- Commit: \`${context.sha}\``
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
